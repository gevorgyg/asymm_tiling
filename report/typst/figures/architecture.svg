<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="100%" height="100%" style="background-color: #ffffff; font-family: 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif;">
  <defs>
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50"/>
    </marker>
    <marker id="inheritance" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <polygon points="0,1 12,6 0,11" fill="#ffffff" stroke="#2c3e50" stroke-width="1.8"/>
    </marker>
    <marker id="composition" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="11" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,5 8,1 16,5 8,9" fill="#2c3e50"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- COLUMN 1: MultiUnit & PrngFifo -->
  <!-- MULTIUNIT (Compute & Tiling Engine) -->
  <g transform="translate(30, 35)" filter="url(#shadow)">
    <rect width="270" height="205" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8"/>
    <path d="M 0 34 L 270 34" stroke="#2563eb" stroke-width="1.2"/>
    <path d="M 0 130 L 270 130" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header -->
    <rect width="270" height="34" rx="6" fill="#eff6ff"/>
    <rect y="24" width="270" height="10" fill="#eff6ff"/>
    <text x="135" y="22" text-anchor="middle" font-weight="bold" font-size="14" fill="#1e3a8a">MultiUnit</text>
    <!-- Fields -->
    <text x="14" y="52" font-size="11" fill="#334155">- m_, k_, n_: size_t</text>
    <text x="14" y="68" font-size="11" fill="#334155">- small_precision_, ratio_: size_t</text>
    <text x="14" y="84" font-size="11" fill="#334155">- tile_h_, tile_w_: size_t</text>
    <text x="14" y="100" font-size="11" fill="#334155">- orientation_: Orientation</text>
    <text x="14" y="116" font-size="11" fill="#334155">- cache_: std::unique_ptr&lt;CacheUnit&gt;</text>
    <!-- Methods -->
    <text x="14" y="148" font-size="11" fill="#0f172a">+ multiply(): void</text>
    <text x="14" y="164" font-size="11" fill="#0f172a">+ c_stationary_tiling(): void</text>
    <text x="14" y="180" font-size="11" fill="#0f172a">+ b_stationary_tiling(): void</text>
    <text x="14" y="196" font-size="11" fill="#0f172a">+ register_stats(): void</text>
  </g>

  <!-- PRNGFIFO (Hardware Accelerator) -->
  <g transform="translate(30, 335)" filter="url(#shadow)">
    <rect width="270" height="185" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.8"/>
    <path d="M 0 34 L 270 34" stroke="#059669" stroke-width="1.2"/>
    <path d="M 0 120 L 270 120" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header -->
    <rect width="270" height="34" rx="6" fill="#ecfdf5"/>
    <rect y="24" width="270" height="10" fill="#ecfdf5"/>
    <text x="135" y="22" text-anchor="middle" font-weight="bold" font-size="14" fill="#065f46">PrngFifo</text>
    <!-- Fields -->
    <text x="14" y="52" font-size="11" fill="#334155">- capacity_: size_t</text>
    <text x="14" y="68" font-size="11" fill="#334155">- generation_cost_: size_t (gc)</text>
    <text x="14" y="84" font-size="11" fill="#334155">- access_cost_: size_t (ac)</text>
    <text x="14" y="100" font-size="11" fill="#334155">- stalls_, stall_cycles_: uint64_t</text>
    <text x="14" y="116" font-size="11" fill="#334155">- pops_: uint64_t</text>
    <!-- Methods -->
    <text x="14" y="138" font-size="11" fill="#0f172a">+ pop(): void</text>
    <text x="14" y="154" font-size="11" fill="#0f172a">+ is_empty(): bool</text>
    <text x="14" y="170" font-size="11" fill="#0f172a">+ register_stats(): void</text>
  </g>

  <!-- COLUMN 2: CacheUnit, CacheLevel, Set -->
  <!-- CACHEUNIT -->
  <g transform="translate(390, 35)" filter="url(#shadow)">
    <rect width="290" height="155" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.8"/>
    <path d="M 0 34 L 290 34" stroke="#7c3aed" stroke-width="1.2"/>
    <path d="M 0 98 L 290 98" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header -->
    <rect width="290" height="34" rx="6" fill="#f5f3ff"/>
    <rect y="24" width="290" height="10" fill="#f5f3ff"/>
    <text x="145" y="22" text-anchor="middle" font-weight="bold" font-size="14" fill="#5b21b6">CacheUnit</text>
    <!-- Fields -->
    <text x="14" y="52" font-size="11" fill="#334155">- levels_: vector&lt;unique_ptr&lt;CacheLevel&gt;&gt;</text>
    <text x="14" y="68" font-size="11" fill="#334155">- block_size_, mem_cycles_: size_t</text>
    <text x="14" y="84" font-size="11" fill="#334155">- total_access_cycles_: uint64_t</text>
    <!-- Methods -->
    <text x="14" y="116" font-size="11" fill="#0f172a">+ do_read(addr: RawAddr): void</text>
    <text x="14" y="132" font-size="11" fill="#0f172a">+ do_write(addr: RawAddr): void</text>
    <text x="14" y="148" font-size="11" fill="#0f172a">+ register_stats(): void</text>
  </g>

  <!-- CACHELEVEL -->
  <g transform="translate(390, 235)" filter="url(#shadow)">
    <rect width="290" height="175" rx="6" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.8"/>
    <path d="M 0 34 L 290 34" stroke="#4f46e5" stroke-width="1.2"/>
    <path d="M 0 115 L 290 115" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header -->
    <rect width="290" height="34" rx="6" fill="#eef2ff"/>
    <rect y="24" width="290" height="10" fill="#eef2ff"/>
    <text x="145" y="22" text-anchor="middle" font-weight="bold" font-size="14" fill="#312e81">CacheLevel</text>
    <!-- Fields -->
    <text x="14" y="52" font-size="11" fill="#334155">- sets_: vector&lt;Set&gt;</text>
    <text x="14" y="68" font-size="11" fill="#334155">- level_idx_, assoc_, cycles_: size_t</text>
    <text x="14" y="84" font-size="11" fill="#334155">- write_allocate_: bool</text>
    <text x="14" y="100" font-size="11" fill="#334155">- upper_level_, lower_level_: CacheLevel*</text>
    <!-- Methods -->
    <text x="14" y="132" font-size="11" fill="#0f172a">+ read(addr: RawAddr): void</text>
    <text x="14" y="148" font-size="11" fill="#0f172a">+ write(addr: RawAddr): void</text>
    <text x="14" y="164" font-size="11" fill="#0f172a">+ insert(line: CacheLine): void</text>
  </g>

  <!-- SET -->
  <g transform="translate(390, 455)" filter="url(#shadow)">
    <rect width="290" height="145" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <path d="M 0 34 L 290 34" stroke="#334155" stroke-width="1.2"/>
    <path d="M 0 80 L 290 80" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Header -->
    <rect width="290" height="34" rx="6" fill="#f1f5f9"/>
    <rect y="24" width="290" height="10" fill="#f1f5f9"/>
    <text x="145" y="22" text-anchor="middle" font-weight="bold" font-size="14" fill="#0f172a">Set</text>
    <!-- Fields -->
    <text x="14" y="52" font-size="11" fill="#334155">- ways_: vector&lt;CacheLine&gt;</text>
    <text x="14" y="68" font-size="11" fill="#334155">- policy_: unique_ptr&lt;ReplacementPolicy&gt;</text>
    <!-- Methods -->
    <text x="14" y="98" font-size="11" fill="#0f172a">+ find(tag: uint64_t): int</text>
    <text x="14" y="114" font-size="11" fill="#0f172a">+ touch(way: int): void</text>
    <text x="14" y="130" font-size="11" fill="#0f172a">+ insert(line: CacheLine): optional&lt;CacheLine&gt;</text>
  </g>

  <!-- COLUMN 3: Infrastructure, ReplacementPolicy, CacheLine -->
  <!-- SIMULATION INFRASTRUCTURE -->
  <g transform="translate(770, 35)" filter="url(#shadow)">
    <rect width="250" height="140" rx="6" fill="#fafafa" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="125" y="23" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#475569">Simulation Infrastructure</text>
    <line x1="12" y1="32" x2="238" y2="32" stroke="#cbd5e1"/>
    <text x="16" y="52" font-weight="bold" font-size="11" fill="#1e293b">Clock (Singleton)</text>
    <text x="24" y="68" font-size="10.5" fill="#475569">+ tick(cycles: uint64_t)</text>
    <text x="24" y="82" font-size="10.5" fill="#475569">+ get_cycles(): uint64_t</text>
    <line x1="16" y1="92" x2="234" y2="92" stroke="#e2e8f0"/>
    <text x="16" y="109" font-weight="bold" font-size="11" fill="#1e293b">Registry (Singleton)</text>
    <text x="24" y="125" font-size="10.5" fill="#475569">+ reg_stat&lt;T&gt;(name, getter)</text>
  </g>

  <!-- REPLACEMENT POLICY (Interface) -->
  <g transform="translate(770, 220)" filter="url(#shadow)">
    <rect width="250" height="135" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.8"/>
    <path d="M 0 38 L 250 38" stroke="#d97706" stroke-width="1.2"/>
    <rect width="250" height="38" rx="6" fill="#fffbeb"/>
    <rect y="26" width="250" height="12" fill="#fffbeb"/>
    <text x="125" y="17" text-anchor="middle" font-size="10" fill="#b45309">&lt;&lt;interface&gt;&gt;</text>
    <text x="125" y="32" text-anchor="middle" font-weight="bold" font-size="13" fill="#92400e">ReplacementPolicy</text>
    <text x="14" y="58" font-size="11" fill="#0f172a">+ touch(way: int)*: void</text>
    <text x="14" y="76" font-size="11" fill="#0f172a">+ insert(way: int)*: void</text>
    <text x="14" y="94" font-size="11" fill="#0f172a">+ invalidate(way: int)*: void</text>
    <text x="14" y="112" font-size="11" fill="#0f172a">+ find_victim()*: int</text>
  </g>

  <!-- LRU POLICY -->
  <g transform="translate(770, 385)" filter="url(#shadow)">
    <rect width="250" height="85" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.6"/>
    <path d="M 0 32 L 250 32" stroke="#d97706" stroke-width="1"/>
    <rect width="250" height="32" rx="6" fill="#fffbeb"/>
    <rect y="22" width="250" height="10" fill="#fffbeb"/>
    <text x="125" y="21" text-anchor="middle" font-weight="bold" font-size="13" fill="#92400e">LruPolicy</text>
    <text x="14" y="50" font-size="10.5" fill="#334155">- lru_order_: vector&lt;int&gt;</text>
    <text x="14" y="68" font-size="10.5" fill="#0f172a">+ touch, insert, find_victim...</text>
  </g>

  <!-- CACHELINE STRUCT -->
  <g transform="translate(770, 490)" filter="url(#shadow)">
    <rect width="250" height="110" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
    <path d="M 0 34 L 250 34" stroke="#64748b" stroke-width="1"/>
    <rect width="250" height="34" rx="6" fill="#f8fafc"/>
    <text x="125" y="16" text-anchor="middle" font-size="9.5" fill="#64748b">&lt;&lt;struct&gt;&gt;</text>
    <text x="125" y="29" text-anchor="middle" font-weight="bold" font-size="12" fill="#334155">CacheLine</text>
    <text x="14" y="52" font-size="11" fill="#334155">+ addr: RawAddr</text>
    <text x="14" y="68" font-size="11" fill="#334155">+ tag: uint64_t</text>
    <text x="14" y="84" font-size="11" fill="#334155">+ valid, dirty: bool</text>
  </g>

  <!-- CONNECTOR LINES & RELATIONSHIPS -->
  <!-- MultiUnit contains CacheUnit -->
  <line x1="300" y1="100" x2="390" y2="100" stroke="#2c3e50" stroke-width="1.8" marker-start="url(#composition)"/>
  <text x="330" y="91" font-size="10.5" fill="#475569">1</text>
  <text x="370" y="91" font-size="10.5" fill="#475569">1</text>

  <!-- MultiUnit contains PrngFifo -->
  <line x1="165" y1="240" x2="165" y2="335" stroke="#2c3e50" stroke-width="1.8" marker-start="url(#composition)"/>
  <text x="175" y="260" font-size="10.5" fill="#475569">1</text>
  <text x="175" y="325" font-size="10.5" fill="#475569">0..1</text>

  <!-- CacheUnit contains CacheLevel (1..N) -->
  <line x1="535" y1="190" x2="535" y2="235" stroke="#2c3e50" stroke-width="1.8" marker-start="url(#composition)"/>
  <text x="545" y="208" font-size="10.5" fill="#475569">1</text>
  <text x="545" y="226" font-size="10.5" fill="#475569">1..N</text>

  <!-- CacheLevel contains Set -->
  <line x1="535" y1="410" x2="535" y2="455" stroke="#2c3e50" stroke-width="1.8" marker-start="url(#composition)"/>
  <text x="545" y="428" font-size="10.5" fill="#475569">1</text>
  <text x="545" y="446" font-size="10.5" fill="#475569">num_sets</text>

  <!-- Set contains ReplacementPolicy -->
  <path d="M 680 500 L 725 500 L 725 285 L 770 285" fill="none" stroke="#2c3e50" stroke-width="1.8" marker-start="url(#composition)"/>
  <text x="735" y="278" font-size="10.5" fill="#475569">1</text>

  <!-- Set contains CacheLine -->
  <line x1="680" y1="545" x2="770" y2="545" stroke="#2c3e50" stroke-width="1.8" marker-start="url(#composition)"/>
  <text x="720" y="538" font-size="10.5" fill="#475569">assoc</text>

  <!-- LruPolicy inherits ReplacementPolicy -->
  <line x1="895" y1="385" x2="895" y2="355" stroke="#2c3e50" stroke-width="1.8" marker-end="url(#inheritance)"/>

</svg>